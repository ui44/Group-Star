name: Build GroupStar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip
          sudo unzip -q gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew
          ls -la gradle/wrapper/

      - name: Build Debug APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} artifacts/GroupStar-debug.apk \;
          ls -la artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GroupStar-APK
          path: artifacts/GroupStar-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "GroupStar v${{ github.run_number }}"
          body: |
            ## ⭐ GroupStar Android App

            ### الميزات:
            | الميزة | الوصف |
            |--------|--------|
            | 🔑 Token Login | دخول بالتوكن — متعدد الحسابات بدون تسجيل خروج |
            | 🔇 Fake Deafen | تظهر ديفن للكل — بس تسمع وتتكلم بحرية |
            | 🖥️ Desktop Spoof | Discord يشوفك Windows PC |
            | 🧩 Vencord | كل البلاقن مفعّلة تلقائياً |
            | 🎵 ツcore | إكستنشن الصوت الكاملة مدمجة |
            | 🔊 WebView Unlocked | بدون حدود متصفح، صوت أقوى |

            ### تثبيت:
            1. حمّل **`GroupStar-debug.apk`** من الأسفل
            2. فعّل **"مصادر غير معروفة"** في إعدادات الأمان
            3. ثبّت وشغّل
            4. حط التوكن وادخل 🎉
          files: artifacts/GroupStar-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
