name: Build DsCome APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-xposed:
    name: Build DsCome Xposed Module
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;34.0.0" "platform-tools"

      - name: Make gradlew executable
        working-directory: DsCome-Xposed
        run: chmod +x gradlew

      - name: Build Xposed Release APK
        working-directory: DsCome-Xposed
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Collect Xposed APK
        run: |
          mkdir -p artifacts
          APK=$(find DsCome-Xposed/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "APK not found!"; exit 1; fi
          cp "$APK" artifacts/DsCome-Xposed.apk
          ls -lh artifacts/

      - name: Upload Xposed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DsCome-Xposed-APK
          path: artifacts/DsCome-Xposed.apk
          retention-days: 30

      - name: Release Xposed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xposed-v${{ github.run_number }}
          name: "DsCome Xposed v${{ github.run_number }}"
          body: |
            ## DsCome Xposed Module

            | Feature | Description |
            |---------|-------------|
            | 🔇 Fake Deafen | Appear deafened — audio stays active |
            | 🔑 Token Login | Login with token + account switcher |
            | ☢️ Nuker | Full server nuker (channels, roles, ban, kick…) |
            | ツ ツcore | Full audio engine — EQ, gain, voice changer |
            | 🧩 Plugins | All original DsCome plugins intact |

            ### Requirements
            - Android 7.0+ (API 24+)
            - LSPosed / EdXposed installed
            - Discord app installed
            - Enable module for Discord in LSPosed Manager

            ### Install
            1. Download `DsCome-Xposed.apk`
            2. Install it
            3. Enable it for Discord in LSPosed Manager
            4. Reboot / restart Discord
          files: artifacts/DsCome-Xposed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-webview:
    name: Build GroupStar WebView App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build WebView Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Collect WebView APK
        run: |
          mkdir -p artifacts
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "APK not found!"; exit 1; fi
          cp "$APK" artifacts/GroupStar-WebView.apk
          ls -lh artifacts/

      - name: Upload WebView APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GroupStar-WebView-APK
          path: artifacts/GroupStar-WebView.apk
          retention-days: 30

      - name: Release WebView APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: webview-v${{ github.run_number }}
          name: "GroupStar WebView v${{ github.run_number }}"
          body: |
            ## GroupStar WebView App

            | Feature | Description |
            |---------|-------------|
            | 🔑 Token Login | Multi-account login with token |
            | 🔇 Fake Deafen | Appear deafened, audio stays on |
            | 🖥️ Desktop Spoof | Discord sees you as Windows PC |
            | 🧩 Vencord | All plugins enabled automatically |
            | ツ ツcore | Full audio engine built-in |
            | 🔊 WebView | Unrestricted browser, stronger audio |

            ### Install
            1. Download `GroupStar-WebView.apk`
            2. Enable **"Unknown sources"** in Security settings
            3. Install and launch
            4. Enter your token and go 🎉
          files: artifacts/GroupStar-WebView.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
