name: Build GroupStar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" | while read f; do
            cp "$f" "artifacts/$(basename $f)"
          done
          ls -la artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GroupStar-APK
          path: artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "GroupStar v${{ github.run_number }}"
          body: |
            ## ⭐ GroupStar Android App

            ### الميزات:
            | الميزة | الوصف |
            |--------|--------|
            | 🔑 Token Login | دخول بالتوكن — متعدد الحسابات بدون تسجيل خروج |
            | 🔇 Fake Deafen | تظهر ديفن للكل — بس تسمع وتتكلم بحرية |
            | 🖥️ Desktop Spoof | Discord يشوفك Windows PC |
            | 🧩 Vencord | كل البلاقن مفعّلة تلقائياً |
            | 🎵 ツcore | إكستنشن الصوت الكاملة مدمجة |
            | 🔊 WebView Unlocked | بدون حدود متصفح، صوت أقوى |

            ### تثبيت:
            1. حمّل `app-debug.apk`
            2. فعّل **"مصادر غير معروفة"** في إعدادات الأمان
            3. ثبّت وشغّل
            4. حط التوكن وادخل 🎉
          files: artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
